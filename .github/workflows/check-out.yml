name: Check out — integrated SDK and test applications

on:
  push:
    branches: [main, fix/qa-gaps-005, fix/border-fidelity-006]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: check-out-${{ github.ref }}
  cancel-in-progress: false

jobs:
  delivery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify delivery and destructive-operation counterexamples
        run: python -B -m unittest discover -s scripts/check-out -p 'test_*.py' -v

  core-and-hosts:
    uses: ./.github/workflows/ci.yml
  openxml:
    uses: ./.github/workflows/q003c-openxml-analytics-gate.yml
  ios:
    uses: ./.github/workflows/chatgpt-ios-analytics-smoke.yml
  windows-packages:
    uses: ./.github/workflows/release-009-packages.yml
  maui-packages:
    uses: ./.github/workflows/release-009-maui-packages.yml
  legacy-demo:
    uses: ./.github/workflows/release-009-demo.yml
  avalonia:
    uses: ./.github/workflows/avalonia-primary-ribbon-002.yml

  applications:
    name: Publish and smoke ${{ matrix.rid }}
    needs: [delivery-tests, avalonia]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    env:
      NERA_SOURCE_SHA: ${{ github.sha }}
      NERA_AVALONIA_ARTIFACTS: artifacts/published-images
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-6 libice6 libsm6 libfontconfig1 libxcb1 libxrender1 libxrandr2 libxi6 libgl1 libegl1 fonts-dejavu-core
      - name: Publish a self-contained application, not only the SDK DLL
        run: dotnet publish samples/NeraSpreadSheet.Avalonia.Sample/NeraSpreadSheet.Avalonia.Sample.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishTrimmed=false -p:PublishSingleFile=false -o artifacts/app
      - name: Execute the actual published application and keep native evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/published-images -Force | Out-Null
          $app = Join-Path $pwd 'artifacts/app/NeraSpreadSheet.Avalonia.Sample'
          if ($IsWindows) { $app += '.exe' }
          foreach ($mode in @('smoke', 'full-ui-smoke', 'formula-ux-smoke', 'ribbon-visual-smoke', 'dialogs-smoke', 'compatibility-smoke', 'qa-gaps-smoke')) {
            if ($IsLinux) { $lines = & xvfb-run -a $app "--$mode" 2>&1 }
            else { $lines = & $app "--$mode" 2>&1 }
            $exitCode = $LASTEXITCODE
            $lines | ForEach-Object { Write-Host $_ }
            if ($exitCode -ne 0) { throw "Published application $mode failed with exit code $exitCode" }
          }
      - name: Build the Check out folder and downloadable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/check-out -Force | Out-Null
          Copy-Item artifacts/app/* artifacts/check-out/ -Recurse -Force
          Copy-Item artifacts/published-images artifacts/check-out/Images -Recurse -Force
          Compress-Archive -Path artifacts/check-out/* -DestinationPath "artifacts/NeraSpreadSheet-${{ matrix.rid }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NeraSpreadSheet-${{ matrix.rid }}
          path: |
            artifacts/NeraSpreadSheet-${{ matrix.rid }}.zip
            artifacts/check-out/**
          if-no-files-found: error
      - name: Keep actual failure logs without pretending they are a package
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NeraSpreadSheet-${{ matrix.rid }}-failure
          path: artifacts/published-images/**
          if-no-files-found: ignore

  download-centre:
    name: Verified Check out download centre
    needs: [delivery-tests, core-and-hosts, openxml, ios, windows-packages, maui-packages, legacy-demo, avalonia, applications]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: NeraSpreadSheet-*
          path: artifacts/downloads
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: experimental-*
          path: artifacts/downloads
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: avalonia-*
          path: artifacts/downloads
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: maui-*
          path: artifacts/downloads
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: openxml-*
          path: artifacts/downloads
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: ios-*
          path: artifacts/downloads
          merge-multiple: true
      - name: Assemble exact-source downloads; publish prerelease only from validated main
        run: python scripts/check-out/pack.py --source artifacts/downloads --output 'Check out' --source-sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --ref "${{ github.ref }}"
      - uses: actions/upload-artifact@v4
        with:
          name: NeraSpreadSheet-Check-out
          path: Check out/**
          if-no-files-found: error

  archive-superseded-branches:
    name: Archive and remove superseded branches (once)
    needs: [download-centre]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Archive and remove superseded branches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(git ls-remote --heads origin 'refs/heads/*' | awk '{sub("refs/heads/", "", $2); print $2}' | grep -v '^main$' | sort)
          if [ ${#branches[@]} -eq 0 ]; then
            echo "No superseded branches remain."
            exit 0
          fi
          stamp=$(date -u +%Y%m%d)
          index=0
          for branch in "${branches[@]}"; do
            index=$((index + 1))
            sha=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
            [ -n "$sha" ] || continue
            safe=$(printf '%03d' "$index")
            tag="archive/consolidation-${stamp}/${safe}"
            git tag -f "$tag" "$sha"
            git push origin "refs/tags/$tag" --force
            git push origin --delete "$branch"
          done
