name: Apply F010 implementation once

on:
  push:
    branches:
      - feature/bootstrap-architecture-v0.1
    paths:
      - scripts/.f010-payload.b64
      - .github/workflows/apply-f010.yml

permissions:
  contents: write

concurrency:
  group: apply-f010
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Rebuild and apply F010 source
        shell: bash
        run: |
          base64 --decode scripts/.f010-payload.b64 | gzip --decompress > scripts/apply-f010.py
          python scripts/apply-f010.py

      - name: Harden generated F010 source and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path(
              "tests/NeraSpreadSheet.Formulas.Tests/"
              "AdvancedReferenceAndAggregationFormulaFunctionTests.cs"
          )
          test_text = test_path.read_text(encoding="utf-8")
          old_type = "IReadOnlyList<FormulaPivotFieldItem> LastPivotItems"
          new_type = "FormulaPivotFieldItem[] LastPivotItems"
          if old_type not in test_text:
              raise SystemExit("Expected LastPivotItems declaration was not found.")
          test_text = test_text.replace(old_type, new_type)
          test_text = test_text.replace(
              "LastPivotItems.Count",
              "LastPivotItems.Length",
          )
          test_path.write_text(test_text, encoding="utf-8")

          indirect_path = Path(
              "src/NeraSpreadSheet.Formulas/"
              "IndirectAndPivotFormulaEngine.cs"
          )
          indirect_text = indirect_path.read_text(encoding="utf-8")
          old_guard = (
              "        if (trimmed.Length == 0 ||\n"
              "            trimmed.Contains('[') ||\n"
              "            trimmed.Contains(']') ||\n"
              "            !TrySplitWorksheet(\n"
          )
          new_guard = (
              "        if (trimmed.Length == 0 ||\n"
              "            !TrySplitWorksheet(\n"
          )
          if indirect_text.count(old_guard) != 1:
              raise SystemExit(
                  "Expected INDIRECT bracket guard was not found exactly once."
              )
          indirect_path.write_text(
              indirect_text.replace(old_guard, new_guard),
              encoding="utf-8",
          )
          PY

      - name: Restore
        run: dotnet restore NeraSpreadSheet.Core.slnx

      - name: Build
        run: dotnet build NeraSpreadSheet.Core.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NeraSpreadSheet.Core.slnx -c Release --no-build

      - name: Verify architecture
        shell: pwsh
        run: ./scripts/verify-architecture.ps1

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit generated implementation
        shell: bash
        run: |
          rm scripts/apply-f010.py scripts/.f010-payload.b64 .github/workflows/apply-f010.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement F010 advanced reference and aggregation"
          git push origin HEAD:feature/bootstrap-architecture-v0.1
