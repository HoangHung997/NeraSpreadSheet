name: Apply Pivot OpenXML standard patch once

on:
  push:
    branches:
      - feature/bootstrap-architecture-v0.1
    paths:
      - scripts/.pivot-openxml-standard-runner.sh
      - .github/workflows/apply-pivot-openxml-standard.yml

permissions:
  contents: write

concurrency:
  group: apply-pivot-openxml-standard
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/bootstrap-architecture-v0.1
          fetch-depth: 0
      - name: Apply Pivot OpenXML standard patch
        shell: bash
        run: bash scripts/.pivot-openxml-standard-runner.sh
      - name: Restore
        run: dotnet restore NeraSpreadSheet.Core.slnx
      - name: Build
        run: dotnet build NeraSpreadSheet.Core.slnx -c Release --no-restore
      - name: Test OpenXML
        run: dotnet test tests/NeraSpreadSheet.OpenXml.Tests/NeraSpreadSheet.OpenXml.Tests.csproj -c Release --no-build
      - name: Verify architecture
        shell: pwsh
        run: ./scripts/verify-architecture.ps1
      - name: Verify patch formatting
        run: git diff --check
      - name: Commit generated pivot implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/.pivot-openxml-standard-runner.sh .github/workflows/apply-pivot-openxml-standard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(openxml): add standard pivot table codec"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          expected_tree="0b4f9d403bf6d80489ac1949604ba0ca15173b59"
          if [ "$actual_tree" != "$expected_tree" ]; then
            echo "::error::tree mismatch: expected $expected_tree but got $actual_tree"
            exit 1
          fi
          git push origin HEAD:feature/bootstrap-architecture-v0.1
