name: PAGE-SETUP-008

on:
  push:
    branches: [fix/page-setup-008]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore NeraSpreadSheet.Avalonia.slnx
      - name: Build Avalonia and analyzers
        run: dotnet build NeraSpreadSheet.Avalonia.slnx -c Release --no-restore
      - name: Avalonia page setup regressions
        run: dotnet test tests/NeraSpreadSheet.Avalonia.Tests/NeraSpreadSheet.Avalonia.Tests.csproj -c Release --no-build
      - name: Core print regressions
        run: dotnet test tests/NeraSpreadSheet.Core.Tests/NeraSpreadSheet.Core.Tests.csproj -c Release
      - name: OpenXML print regressions
        run: dotnet test tests/NeraSpreadSheet.OpenXml.Tests/NeraSpreadSheet.OpenXml.Tests.csproj -c Release
      - name: PDF print regressions
        run: dotnet test tests/NeraSpreadSheet.Export.Pdf.Tests/NeraSpreadSheet.Export.Pdf.Tests.csproj -c Release
