name: ci

on:
  push:
    branches:
      - feature/bootstrap-architecture-v0.1

permissions:
  contents: write

jobs:
  apply-security-doc-evidence-patch:
    name: Apply security docs evidence patch
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download patch
        run: |
          curl -fsSL https://paste.rs/8K3UI -o security-doc-evidence.patch
          echo "20CB1CEA8949F8BFEFE77262945CD385584C9CEE2B4C6E21B07E21ABEC299ADC  security-doc-evidence.patch" | sha256sum -c -
      - name: Apply patch
        run: git apply security-doc-evidence.patch
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/worklog/SECURITY_RECOVERY.md docs/worklog/AI_COORDINATION.md docs/worklog/CURRENT.md docs/current-status.md
          git commit -m "Record security recovery checkpoint evidence"
          git push
