name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate native result transport parser
        run: python3 -B scripts/test-native-smoke-result.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NeraSpreadSheet.Core.slnx

      - name: Build
        run: dotnet build NeraSpreadSheet.Core.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NeraSpreadSheet.Core.slnx -c Release --no-build --logger "trx;LogFileName=core-tests.trx"

      - name: Verify architecture
        shell: pwsh
        run: ./scripts/verify-architecture.ps1

      - name: Verify SDK packaging metadata
        shell: pwsh
        run: ./scripts/verify-packaging-sdk.ps1

      - name: Pack SDK packages
        run: dotnet pack NeraSpreadSheet.Core.slnx -c Release --no-build -o artifacts/packages

      - name: Upload SDK packages
        uses: actions/upload-artifact@v4
        with:
          name: sdk-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  windows-hosts:
    name: Windows hosts build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NeraSpreadSheet.slnx

      - name: Build
        run: dotnet build NeraSpreadSheet.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NeraSpreadSheet.Core.slnx -c Release --no-build --logger "trx;LogFileName=windows-tests.trx"

      - name: Windows desktop GPU runtime smoke
        run: dotnet test tests/NeraSpreadSheet.Windows.Rendering.Tests/NeraSpreadSheet.Windows.Rendering.Tests.csproj -c Release --no-build --logger "trx;LogFileName=windows-renderer-smoke.trx"

      - name: Capture SDK Ribbon visual matrix
        shell: pwsh
        run: ./scripts/capture-ribbon-visual.ps1

      - name: Upload SDK Ribbon visual matrix
        uses: actions/upload-artifact@v4
        with:
          name: ribbon-visual-matrix
          path: artifacts/ribbon-visual-011/captures/
          if-no-files-found: error

  maui-windows:
    name: MAUI Windows GPU host build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Build MAUI Windows target
        run: dotnet build src/NeraSpreadSheet.Maui/NeraSpreadSheet.Maui.csproj -c Release -f net10.0-windows10.0.19041.0 -p:NeraMauiTargetFrameworks=net10.0-windows10.0.19041.0

      - name: Verify MAUI handler resolution
        run: dotnet test tests/NeraSpreadSheet.Maui.Tests/NeraSpreadSheet.Maui.Tests.csproj -c Release -p:NeraMauiTargetFrameworks=net10.0-windows10.0.19041.0 --logger "trx;LogFileName=maui-handler-tests.trx"

      - name: Publish loaded MAUI Windows Ribbon smoke
        run: dotnet publish tests/NeraSpreadSheet.Maui.Windows.RibbonSmoke/NeraSpreadSheet.Maui.Windows.RibbonSmoke.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained false -p:NeraMauiTargetFrameworks=net10.0-windows10.0.19041.0 -o artifacts/maui-windows-ribbon-smoke

      - name: Run loaded MAUI Windows Ribbon smoke
        shell: pwsh
        run: ./scripts/run-maui-windows-smoke.ps1 -ExecutablePath "artifacts/maui-windows-ribbon-smoke/NeraSpreadSheet.Maui.Windows.RibbonSmoke.exe"

      - name: Upload loaded MAUI Ribbon customization captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maui-windows-ribbon-ux007
          path: artifacts/maui-windows-ribbon-smoke/ux007-*.png
          if-no-files-found: error

      - name: Publish loaded MAUI Windows Table filter smoke
        run: dotnet publish tests/NeraSpreadSheet.Maui.Windows.TableFilterSmoke/NeraSpreadSheet.Maui.Windows.TableFilterSmoke.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained false -p:NeraMauiTargetFrameworks=net10.0-windows10.0.19041.0 -o artifacts/maui-windows-table-filter-smoke

      - name: Run loaded MAUI Windows Table filter smoke
        shell: pwsh
        run: ./scripts/run-maui-windows-smoke.ps1 -ExecutablePath "artifacts/maui-windows-table-filter-smoke/NeraSpreadSheet.Maui.Windows.TableFilterSmoke.exe"

      - name: Upload loaded MAUI Filter presentation captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maui-windows-table-filter-ux006
          path: artifacts/maui-windows-table-filter-smoke/ux006-*.png
          if-no-files-found: error

      - name: Publish loaded MAUI Windows runtime smoke
        run: dotnet publish tests/NeraSpreadSheet.Maui.Windows.Smoke/NeraSpreadSheet.Maui.Windows.Smoke.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained false -p:NeraMauiTargetFrameworks=net10.0-windows10.0.19041.0 -o artifacts/maui-windows-smoke

      - name: Run loaded MAUI Windows runtime smoke
        shell: pwsh
        run: ./scripts/run-maui-windows-smoke.ps1 -ExecutablePath "artifacts/maui-windows-smoke/NeraSpreadSheet.Maui.Windows.Smoke.exe"

      - name: Publish loaded MAUI Windows analytics smoke
        run: dotnet publish tests/NeraSpreadSheet.Maui.Windows.AnalyticsSmoke/NeraSpreadSheet.Maui.Windows.AnalyticsSmoke.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained false -p:NeraMauiTargetFrameworks=net10.0-windows10.0.19041.0 -o artifacts/maui-windows-analytics-smoke

      - name: Run loaded MAUI Windows analytics smoke
        shell: pwsh
        run: ./scripts/run-maui-windows-smoke.ps1 -ExecutablePath "artifacts/maui-windows-analytics-smoke/NeraSpreadSheet.Maui.Windows.AnalyticsSmoke.exe"

      - name: Publish loaded MAUI Windows scale smoke
        run: dotnet publish tests/NeraSpreadSheet.Maui.Windows.ScaleSmoke/NeraSpreadSheet.Maui.Windows.ScaleSmoke.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained false -p:NeraMauiTargetFrameworks=net10.0-windows10.0.19041.0 -o artifacts/maui-windows-scale-smoke

      - name: Run loaded MAUI Windows scale smoke
        shell: pwsh
        run: ./scripts/run-maui-windows-smoke.ps1 -ExecutablePath "artifacts/maui-windows-scale-smoke/NeraSpreadSheet.Maui.Windows.ScaleSmoke.exe"

  maui-android:
    name: MAUI Android GPU host build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Build MAUI Android target
        run: dotnet build src/NeraSpreadSheet.Maui/NeraSpreadSheet.Maui.csproj -c Release -f net10.0-android -p:NeraMauiTargetFrameworks=net10.0-android

      - name: Build loaded MAUI Android analytics accessibility smoke
        run: dotnet build tests/NeraSpreadSheet.Maui.Android.AnalyticsSmoke/NeraSpreadSheet.Maui.Android.AnalyticsSmoke.csproj -c Release -f net10.0-android -p:NeraMauiTargetFrameworks=net10.0-android

      - name: Run loaded MAUI Android analytics accessibility smoke
        shell: bash
        run: |
          set -euo pipefail
          ROOT="tests/NeraSpreadSheet.Maui.Android.AnalyticsSmoke/bin/Release/net10.0-android"
          mapfile -t APKS < <(find "$ROOT" -type f -name '*-Signed.apk')
          if [ "${#APKS[@]}" -eq 0 ]; then
            mapfile -t APKS < <(find "$ROOT" -type f -name '*.apk')
          fi
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Android smoke APK is missing or ambiguous."
            exit 1
          fi
          bash scripts/run-maui-android-smoke.sh "${APKS[0]}"

  maui-apple:
    name: MAUI Apple GPU host builds
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install MAUI Apple workloads
        run: dotnet workload install maui-ios maui-maccatalyst --skip-manifest-update

      - name: Build MAUI iOS target
        run: dotnet build src/NeraSpreadSheet.Maui/NeraSpreadSheet.Maui.csproj -c Release -f net10.0-ios -p:NeraMauiTargetFrameworks=net10.0-ios

      - name: Build MAUI Mac Catalyst target
        run: dotnet build src/NeraSpreadSheet.Maui/NeraSpreadSheet.Maui.csproj -c Release -f net10.0-maccatalyst -p:NeraMauiTargetFrameworks=net10.0-maccatalyst

      - name: Build loaded MAUI Mac Catalyst analytics accessibility smoke
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            RID="maccatalyst-arm64"
          else
            RID="maccatalyst-x64"
          fi
          echo "NERA_MACCATALYST_SMOKE_RID=$RID" >> "$GITHUB_ENV"
          echo "Mac Catalyst smoke RID: $RID"
          dotnet build tests/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke.csproj -c Release -f net10.0-maccatalyst -r "$RID" -p:NeraMauiTargetFrameworks=net10.0-maccatalyst

      - name: Run loaded MAUI Mac Catalyst analytics accessibility smoke
        shell: bash
        run: |
          set -euo pipefail
          ROOT="tests/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke/bin/Release/net10.0-maccatalyst/$NERA_MACCATALYST_SMOKE_RID"
          RESULT="$RUNNER_TEMP/nera-maccatalyst-analytics-smoke.json"
          APP="$(find "$ROOT" -type d -name 'NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke.app' | head -n 1 || true)"
          if [ -z "$APP" ]; then
            echo "Mac Catalyst analytics smoke app bundle was not produced."
            find "$ROOT" -maxdepth 6 -print || true
            exit 1
          fi

          bash ./scripts/run-maui-maccatalyst-smoke.sh "$APP" "$RESULT"
