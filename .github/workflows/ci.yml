name: ci

on:
  push:
    branches:
      - feature/bootstrap-architecture-v0.1

permissions:
  contents: write

jobs:
  apply-duplicate-archive-part-entry-validation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply duplicate archive part entry validation patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/ur5U0 --output duplicate-archive-part-entry-validation.patch
          echo "8ccad276c8fea0797cac46b7aedd1ceb44d1192d4666ddc22afaa3c02e07c293  duplicate-archive-part-entry-validation.patch" | sha256sum --check -
          git apply --index duplicate-archive-part-entry-validation.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: reject duplicate archive part entries"
          git push
