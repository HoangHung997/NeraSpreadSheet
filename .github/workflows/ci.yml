name: ci

on:
  push:
    branches:
      - feature/bootstrap-architecture-v0.1

permissions:
  contents: write

jobs:
  apply-content-type-override-partname-validation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply content type override PartName validation patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/P227N --output content-type-override-partname-validation.patch
          echo "2525c5d926dd230c9a4b2b5305461bbd376c93ba4e9134173de3d60f9edb331a  content-type-override-partname-validation.patch" | sha256sum --check -
          git apply --index content-type-override-partname-validation.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: validate content type override part names"
          git push
