name: ci

on:
  push:
    branches:
      - feature/bootstrap-architecture-v0.1

permissions:
  contents: write

jobs:
  apply-workbook-save-recovery-fix:
    name: Apply workbook save recovery build fix
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download patch
        run: |
          curl -fsSL https://paste.rs/UJrcL -o security-workbook-save-recovery-fix.patch
          echo "16CB48454469146536B284E9E0937FD4B4EA0E601251D8E3D50077AEA880DCF0  security-workbook-save-recovery-fix.patch" | sha256sum -c -
      - name: Apply patch
        run: git apply security-workbook-save-recovery-fix.patch
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NeraSpreadSheet.OpenXml/NeraOpenXmlWorkbookSerializer.cs
          git commit -m "Fix workbook save recovery build"
          git push
