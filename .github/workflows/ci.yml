name: ci

on:
  push:
    branches:
      - feature/bootstrap-architecture-v0.1

permissions:
  contents: write

jobs:
  apply-preserve-worksheet-replacement-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download patch
        run: curl -fsSL https://paste.rs/9gJrZ -o security-preserve-worksheet-replacement.patch
      - name: Verify patch checksum
        run: echo "fc58c95ab45428b2aad3bdc0b20ec5de337706fe4564c06a68f4218bdb219c89  security-preserve-worksheet-replacement.patch" | sha256sum -c -
      - name: Apply patch
        run: git apply --index security-preserve-worksheet-replacement.patch
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: cover preserve unknown worksheet replacement rejection"
      - name: Push patch commit
        run: git push origin HEAD:feature/bootstrap-architecture-v0.1
