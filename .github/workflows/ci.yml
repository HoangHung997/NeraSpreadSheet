name: ci

on:
  push:
    branches:
      - feature/bootstrap-architecture-v0.1

permissions:
  contents: write

jobs:
  apply-content-type-hardening-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply content type hardening docs patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/Nygye --output content-type-hardening-docs.patch
          echo "940783b871a52ca88de48ffc457a2dcd23d37ab91f4e0b3dd1705e1d8ef40dbd  content-type-hardening-docs.patch" | sha256sum --check -
          git apply --index content-type-hardening-docs.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record content type hardening evidence"
          git push
