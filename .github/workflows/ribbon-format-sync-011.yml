name: RIBBON-FORMAT-SYNC-011

on:
  push:
    branches: [fix/ribbon-format-sync-011]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NERA_SOURCE_SHA: ${{ github.sha }}
      NERA_AVALONIA_ARTIFACTS: artifacts/avalonia
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore NeraSpreadSheet.Avalonia.slnx
      - name: Build + analyzers
        run: dotnet build NeraSpreadSheet.Avalonia.slnx -c Release --no-restore
      - name: Avalonia regressions
        run: dotnet test tests/NeraSpreadSheet.Avalonia.Tests/NeraSpreadSheet.Avalonia.Tests.csproj -c Release --no-build
      - name: Native Ribbon formatting sync, visual, and QA smoke
        shell: pwsh
        run: |
          dotnet publish samples/NeraSpreadSheet.Avalonia.Sample/NeraSpreadSheet.Avalonia.Sample.csproj -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -p:PublishSingleFile=false -o artifacts/app
          $app = Join-Path $pwd 'artifacts/app/NeraSpreadSheet.Avalonia.Sample.exe'
          & $app --format-sync-smoke
          if ($LASTEXITCODE -ne 0) { throw "Ribbon format sync smoke failed: $LASTEXITCODE" }
          & $app --ribbon-visual-smoke
          if ($LASTEXITCODE -ne 0) { throw "Ribbon visual smoke failed: $LASTEXITCODE" }
          & $app --qa-gaps-smoke
          if ($LASTEXITCODE -ne 0) { throw "QA gaps smoke failed: $LASTEXITCODE" }
