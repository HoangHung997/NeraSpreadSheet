name: FORMAT-SYNC-NATIVE-FIX

on:
  push:
    branches: [fix/excel-edit-date-integration-013]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Project selected DropDown state and harden native smoke
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing pattern in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          items = 'src/NeraSpreadSheet.Avalonia/NeraRibbonControl.Items.cs'
          replace(items,
              'var menu = new ContextMenu(); foreach (var choice in command.SelectableItems) menu.Items.Add(BuildChoice(command.CommandId, choice));\n        arrow.ContextMenu = menu;',
              'var menu = new ContextMenu(); foreach (var choice in command.SelectableItems) menu.Items.Add(BuildChoice(command.CommandId, choice, command.SelectedValue));\n        arrow.ContextMenu = menu;')
          replace(items,
              'var menu = new ContextMenu(); foreach (var choice in command.SelectableItems) menu.Items.Add(BuildChoice(command.CommandId, choice));\n        button.ContextMenu = menu;',
              'var menu = new ContextMenu(); foreach (var choice in command.SelectableItems) menu.Items.Add(BuildChoice(command.CommandId, choice, command.SelectedValue));\n        button.ContextMenu = menu;')
          replace(items,
              '    private MenuItem BuildChoice(CommandId id, CommandItem choice)\n    {\n        var native = new MenuItem\n        {\n            Header = choice.Caption, IsEnabled = choice.IsEnabled,\n            ToggleType = choice.IsChecked.HasValue ? MenuItemToggleType.CheckBox : MenuItemToggleType.None, IsChecked = choice.IsChecked ?? false,\n        };',
              '    private MenuItem BuildChoice(CommandId id, CommandItem choice, string? selectedValue = null)\n    {\n        var selected = choice.IsChecked ?? (selectedValue is not null && string.Equals(choice.Value, selectedValue, StringComparison.Ordinal));\n        var native = new MenuItem\n        {\n            Header = choice.Caption, IsEnabled = choice.IsEnabled,\n            ToggleType = choice.IsChecked.HasValue || selectedValue is not null ? MenuItemToggleType.CheckBox : MenuItemToggleType.None, IsChecked = selected,\n        };')
          replace(items,
              '        foreach (var child in choice.Children) native.Items.Add(BuildChoice(id, child));',
              '        foreach (var child in choice.Children) native.Items.Add(BuildChoice(id, child, selectedValue));')
          replace(items,
              '            foreach (var choice in command.SelectableItems) native.Items.Add(BuildChoice(command.CommandId, choice));',
              '            foreach (var choice in command.SelectableItems) native.Items.Add(BuildChoice(command.CommandId, choice, command.SelectedValue));')

          smoke = 'samples/NeraSpreadSheet.Avalonia.Sample/FullShellWindow.RibbonFormatSyncSmoke.cs'
          replace(smoke,
              '            Check("mixed-border-native", SelectedTag("ribbon-command-Ui.Borders") is null);',
              '            Check("mixed-border-native", SelectedDropDownValue("ribbon-command-Ui.Borders") is null);')
          replace(smoke,
              '            Check("border-native-" + suffix, SelectedTag("ribbon-command-Ui.Borders") == border);',
              '            Check("border-native-" + suffix, SelectedDropDownValue("ribbon-command-Ui.Borders") == border);')
          replace(smoke,
              '        string? SelectedTag(string automationId)\n        {\n            var combo = _ribbon.GetVisualDescendants().OfType<ComboBox>()\n                .SingleOrDefault(control => AutomationProperties.GetAutomationId(control) == automationId);\n            return (combo?.SelectedItem as ComboBoxItem)?.Tag as string;\n        }\n\n        static CellBorderStyle FourSides',
              '        string? SelectedTag(string automationId)\n        {\n            var combo = _ribbon.GetVisualDescendants().OfType<ComboBox>()\n                .SingleOrDefault(control => AutomationProperties.GetAutomationId(control) == automationId);\n            return (combo?.SelectedItem as ComboBoxItem)?.Tag as string;\n        }\n\n        string? SelectedDropDownValue(string automationId)\n        {\n            var button = _ribbon.GetVisualDescendants().OfType<Button>()\n                .SingleOrDefault(control => AutomationProperties.GetAutomationId(control) == automationId);\n            if (button?.ContextMenu is not { } menu) return null;\n            var prefix = automationId + "-choice-";\n            foreach (var item in menu.Items.OfType<MenuItem>())\n            {\n                if (item.IsChecked != true) continue;\n                var id = AutomationProperties.GetAutomationId(item);\n                if (id is not null && id.StartsWith(prefix, StringComparison.Ordinal))\n                    return id[prefix.Length..];\n            }\n            return null;\n        }\n\n        static CellBorderStyle FourSides')

          Path('.github/workflows/format-sync-native-fix.yml').unlink()
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src samples .github/workflows/format-sync-native-fix.yml
          git commit -m "fix(ribbon): project selected DropDown state into native menu"
          git push origin HEAD:fix/excel-edit-date-integration-013
