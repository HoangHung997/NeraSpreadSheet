name: Q003C analytics OpenXML gate

on:
  push:
    branches:
      - 'ai/chatgpt/q003c-analytics-openxml'
      - 'feature/bootstrap-architecture-v0.1'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-pending-pivot-patch:
    name: Apply pending Pivot OpenXML patch
    if: github.event_name == 'push' && github.event.head_commit.message == 'ci: run pending pivot patch runner'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/bootstrap-architecture-v0.1
          fetch-depth: 0

      - name: Apply local-verified patch
        shell: bash
        env:
          PATCH_URL: https://paste.rs/eep8D
          BASE_COMMIT: b806cc7ed2317b456a6171672e577ee816e4692d
          EXPECTED_TREE: 0b4f9d403bf6d80489ac1949604ba0ca15173b59
        run: |
          set -euo pipefail
          curl -fsSL "$PATCH_URL" -o /tmp/pivot-openxml-standard.patch
          git apply --index /tmp/pivot-openxml-standard.patch
          rm -f .github/workflows/apply-pivot-openxml-standard.yml
          git checkout "$BASE_COMMIT" -- .github/workflows/q003c-openxml-analytics-gate.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(openxml): add standard pivot table codec"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          if [ "$actual_tree" != "$EXPECTED_TREE" ]; then
            echo "::error::tree mismatch: expected $EXPECTED_TREE but got $actual_tree"
            exit 1
          fi
          git push origin HEAD:feature/bootstrap-architecture-v0.1

  analytics-openxml:
    name: Analytics session OpenXML persistence
    if: github.event_name != 'push' || github.event.head_commit.message != 'ci: run pending pivot patch runner'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore Core solution
        run: dotnet restore NeraSpreadSheet.Core.slnx

      - name: Build Core solution
        run: dotnet build NeraSpreadSheet.Core.slnx -c Release --no-restore

      - name: Run OpenXML persistence tests
        run: dotnet test tests/NeraSpreadSheet.OpenXml.Tests/NeraSpreadSheet.OpenXml.Tests.csproj -c Release --no-build --logger "trx;LogFileName=q003c-openxml.trx"

      - name: Verify architecture
        shell: pwsh
        run: ./scripts/verify-architecture.ps1
