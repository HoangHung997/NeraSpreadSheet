name: EDITOR-ZOOM-FIDELITY-012

on:
  push:
    branches: [fix/editor-zoom-fidelity-012]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore NeraSpreadSheet.Avalonia.slnx
      - name: Build + analyzers
        run: dotnet build NeraSpreadSheet.Avalonia.slnx -c Release --no-restore
      - name: Avalonia editor zoom regressions
        run: dotnet test tests/NeraSpreadSheet.Avalonia.Tests/NeraSpreadSheet.Avalonia.Tests.csproj -c Release --no-build
      - name: Native regression smoke
        shell: pwsh
        run: |
          dotnet publish samples/NeraSpreadSheet.Avalonia.Sample/NeraSpreadSheet.Avalonia.Sample.csproj -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -p:PublishSingleFile=false -o artifacts/app
          $app = Join-Path $pwd 'artifacts/app/NeraSpreadSheet.Avalonia.Sample.exe'
          & $app --qa-gaps-smoke
          if ($LASTEXITCODE -ne 0) { throw "QA gaps smoke failed: $LASTEXITCODE" }
          & $app --dialogs-smoke
          if ($LASTEXITCODE -ne 0) { throw "Dialog smoke failed: $LASTEXITCODE" }
