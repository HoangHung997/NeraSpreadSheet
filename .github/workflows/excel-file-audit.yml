name: Excel file audit
on:
  push:
    branches: ['feature/excel-file-audit-20260909']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: excel-file-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  harness:
    name: Audit harness and existing Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build original SDK and existing Core solution
        run: dotnet build NeraSpreadSheet.Core.slnx -c Release
      - name: Run unchanged SDK regression tests
        run: dotnet test NeraSpreadSheet.Core.slnx -c Release --no-build --logger "trx;LogFileName=core.trx" --results-directory artifacts/core-tests
      - name: Verify architecture
        shell: pwsh
        run: ./scripts/verify-architecture.ps1
      - name: Build audit harness with repository analyzers
        run: dotnet build eng/excel-file-audit/NeraSpreadSheet.FileAudit.csproj -c Release
      - name: Synthetic self-check, never real-workbook acceptance
        run: dotnet run --project eng/excel-file-audit -c Release --no-build -- --self-test artifacts/harness-selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: excel-audit-harness-${{ github.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
  original:
    name: Original uploaded workbook required
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require original bytes, not a reconstructed or synthetic workbook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'tests/fixtures/excel-file-audit/Excel_CV_ThachBich - Copy.dlda'
          New-Item -ItemType Directory artifacts/real-file -Force | Out-Null
          if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
            'BLOCKED_INPUT_MISSING: original binary not committed; zero real-file probes executed.' | Tee-Object artifacts/real-file/INPUT_STATUS.txt
            throw 'Original workbook is unavailable. Synthetic self-test cannot substitute for it.'
          }
          Get-FileHash -LiteralPath $path -Algorithm SHA256 | Format-List | Out-File artifacts/real-file/input-sha256.txt
          git rev-parse HEAD | Out-File artifacts/real-file/source-sha.txt
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build audit and unchanged production dependencies
        run: dotnet build eng/excel-file-audit/NeraSpreadSheet.FileAudit.csproj -c Release
      - name: Audit original bytes across SDK public APIs
        shell: pwsh
        run: |
          dotnet run --project eng/excel-file-audit -c Release --no-build -- 'tests/fixtures/excel-file-audit/Excel_CV_ThachBich - Copy.dlda' artifacts/real-file
          if ($LASTEXITCODE -ne 0) { throw "Audit returned $LASTEXITCODE. Read real-file/report.json; no compatibility clearance is implied." }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: excel-original-audit-${{ github.sha }}
          path: artifacts/real-file/
          retention-days: 7
          if-no-files-found: error
