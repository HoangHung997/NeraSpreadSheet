name: INTEGRATION-013-CODEMOD

on:
  push:
    branches: [fix/excel-edit-date-integration-013]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply narrow compatibility patch
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Formula engine: DateTime is a numeric Excel serial for arithmetic/comparison.
          path = 'src/NeraSpreadSheet.Formulas/NeraFormulaEngine.cs'
          replace(path,
              'if (!TryNumber(value, out var number))',
              'if (!TryNumber(value, context, out var number))')
          replace(path,
              'var comparison = Compare(left, right);',
              'var comparison = Compare(left, right, context);')
          replace(path,
              'if (!TryNumber(left, out var leftNumber) ||\n            !TryNumber(right, out var rightNumber))',
              'if (!TryNumber(left, context, out var leftNumber) ||\n            !TryNumber(right, context, out var rightNumber))')
          replace(path,
              '''    private static bool TryNumber(\n        CellValue value,\n        out double number)\n    {\n        switch (value.Kind)\n        {\n            case CellValueKind.Number:\n                number = (double)value.RawValue!;\n                return true;\n            case CellValueKind.Boolean:\n                number = (bool)value.RawValue! ? 1d : 0d;\n                return true;\n            case CellValueKind.Blank:\n                number = 0d;\n                return true;\n            default:\n                number = 0d;\n                return false;\n        }\n    }''',
              '''    private static bool TryNumber(\n        CellValue value,\n        out double number) =>\n        FormulaValueCoercion.TryNumber(value, out number);\n\n    private static bool TryNumber(\n        CellValue value,\n        IFormulaEvaluationContext context,\n        out double number) =>\n        FormulaValueCoercion.TryNumber(value, context, out number);''')
          replace(path,
              '''    private static int Compare(CellValue left, CellValue right)\n    {\n        if (TryNumber(left, out var leftNumber) &&\n            TryNumber(right, out var rightNumber))\n        {\n            return leftNumber.CompareTo(rightNumber);\n        }\n\n        return string.Compare(\n            left.ToString(),\n            right.ToString(),\n            StringComparison.OrdinalIgnoreCase);\n    }''',
              '''    private static int Compare(CellValue left, CellValue right) =>\n        Compare(left, right, context: null);\n\n    private static int Compare(\n        CellValue left,\n        CellValue right,\n        IFormulaEvaluationContext? context)\n    {\n        var leftNumeric = context is null\n            ? TryNumber(left, out var leftNumber)\n            : TryNumber(left, context, out leftNumber);\n        var rightNumeric = context is null\n            ? TryNumber(right, out var rightNumber)\n            : TryNumber(right, context, out rightNumber);\n        if (leftNumeric && rightNumeric)\n        {\n            return leftNumber.CompareTo(rightNumber);\n        }\n\n        return string.Compare(\n            left.ToString(),\n            right.ToString(),\n            StringComparison.OrdinalIgnoreCase);\n    }''')

          # Calculation context exposes workbook 1900/1904 date basis.
          path = 'src/NeraSpreadSheet.Formulas/WorkbookCalculationEngine.cs'
          replace(path,
              '''          IFormulaSparseRangeContext,\n          IFormulaWorkbookMetadataEvaluationContext''',
              '''          IFormulaSparseRangeContext,\n          IFormulaWorkbookMetadataEvaluationContext,\n          IFormulaDateSystemEvaluationContext''')
          replace(path,
              '''        public CellAddress CurrentCellAddress => _currentAddress;\n\n        public int WorksheetCount => _workbook.Worksheets.Count;''',
              '''        public CellAddress CurrentCellAddress => _currentAddress;\n\n        public ExcelDateSystem DateSystem => _workbook.DateSystem;\n\n        public int WorksheetCount => _workbook.Worksheets.Count;''')

          # Formatter: DateTime is only a legacy value kind; General/Number expose its serial.
          path = 'src/NeraSpreadSheet.Core/ExcelCellValueFormatter.cs'
          replace(path,
              '''            var numeric = value.Kind == CellValueKind.DateTime\n                ? ToSerial((DateTime)value.RawValue!, dateSystem)\n                : (double)value.RawValue!;''',
              '''            var numeric = value.Kind == CellValueKind.DateTime\n                ? ExcelDateSerial.ToSerial((DateTime)value.RawValue!, dateSystem)\n                : (double)value.RawValue!;''')
          replace(path,
              '''                return value.Kind == CellValueKind.DateTime\n                    ? ((DateTime)value.RawValue!).ToString(culture)\n                    : numeric.ToString("G15", culture);''',
              '''                return numeric.ToString("G15", culture);''')
          replace(path,
              '''    private static double ToSerial(DateTime dateTime, ExcelDateSystem dateSystem) =>\n        dateSystem == ExcelDateSystem.Date1904\n            ? (dateTime - new DateTime(1904, 1, 1)).TotalDays\n            : dateTime.ToOADate();\n\n    private static DateTime FromSerial(double serial, ExcelDateSystem dateSystem) =>\n        dateSystem == ExcelDateSystem.Date1904\n            ? new DateTime(1904, 1, 1).AddDays(serial)\n            : DateTime.FromOADate(serial);''',
              '''    private static DateTime FromSerial(double serial, ExcelDateSystem dateSystem) =>\n        ExcelDateSerial.FromSerial(serial, dateSystem);''')

          # XLSX: normalize ISO date cells to numeric serials and export legacy DateTime as numbers.
          path = 'src/NeraSpreadSheet.OpenXml/NeraOpenXmlWorkbookSerializer.cs'
          replace(path,
              '''                workbook.Styles,\n                options,\n                cancellationToken);''',
              '''                workbook.Styles,\n                workbook.DateSystem,\n                options,\n                cancellationToken);''', count=1)
          replace(path,
              '''        CellStyleCatalog catalog,\n        OpenXmlImportOptions options,''',
              '''        CellStyleCatalog catalog,\n        ExcelDateSystem dateSystem,\n        OpenXmlImportOptions options,''')
          replace(path,
              '''                    : ReadValue(cell, sharedStrings);''',
              '''                    : ReadValue(cell, sharedStrings, dateSystem);''')
          replace(path,
              '''    private static NeraCellValue ReadValue(\n        Cell cell,\n        SharedStringTable? sharedStrings)''',
              '''    private static NeraCellValue ReadValue(\n        Cell cell,\n        SharedStringTable? sharedStrings,\n        ExcelDateSystem dateSystem)''')
          replace(path,
              '''            return DateTime.TryParse(\n                raw,\n                CultureInfo.InvariantCulture,\n                DateTimeStyles.RoundtripKind,\n                out var dateTime)\n                ? NeraCellValue.FromDateTime(dateTime)\n                : NeraCellValue.Blank;''',
              '''            return DateTime.TryParse(\n                raw,\n                CultureInfo.InvariantCulture,\n                DateTimeStyles.RoundtripKind,\n                out var dateTime)\n                ? NeraCellValue.FromNumber(ExcelDateSerial.ToSerial(dateTime, dateSystem))\n                : NeraCellValue.Blank;''')
          replace(path,
              '''                styleTable,\n                options,\n                cancellationToken);''',
              '''                styleTable,\n                workbook.DateSystem,\n                options,\n                cancellationToken);''', count=1)
          replace(path,
              '''        OpenXmlStyleTable styleTable,\n        OpenXmlExportOptions options,\n        CancellationToken cancellationToken)''',
              '''        OpenXmlStyleTable styleTable,\n        ExcelDateSystem dateSystem,\n        OpenXmlExportOptions options,\n        CancellationToken cancellationToken)''', count=1)
          replace(path,
              '''                        styleTable,\n                        options,\n                        sharedFormulaPlan));''',
              '''                        styleTable,\n                        dateSystem,\n                        options,\n                        sharedFormulaPlan));''')
          replace(path,
              '''        OpenXmlStyleTable styleTable,\n        OpenXmlExportOptions options,\n        OpenXmlSharedFormulaExportPlan sharedFormulaPlan)''',
              '''        OpenXmlStyleTable styleTable,\n        ExcelDateSystem dateSystem,\n        OpenXmlExportOptions options,\n        OpenXmlSharedFormulaExportPlan sharedFormulaPlan)''')
          replace(path,
              '''                ApplyValue(cell, data.Value, isFormulaResult: true);''',
              '''                ApplyValue(cell, data.Value, dateSystem, isFormulaResult: true);''')
          replace(path,
              '''        ApplyValue(cell, data.Value, isFormulaResult: false);''',
              '''        ApplyValue(cell, data.Value, dateSystem, isFormulaResult: false);''')
          replace(path,
              '''    private static void ApplyValue(\n        Cell cell,\n        NeraCellValue value,\n        bool isFormulaResult)''',
              '''    private static void ApplyValue(\n        Cell cell,\n        NeraCellValue value,\n        ExcelDateSystem dateSystem,\n        bool isFormulaResult)''')
          replace(path,
              '''            case CellValueKind.DateTime:\n                cell.DataType = CellValues.Date;\n                cell.CellValue = new OpenXmlCellValue(\n                    ((DateTime)value.RawValue!).ToString(\n                        "O",\n                        CultureInfo.InvariantCulture));\n                return;''',
              '''            case CellValueKind.DateTime:\n                cell.CellValue = new OpenXmlCellValue(\n                    ExcelDateSerial.ToSerial(\n                        (DateTime)value.RawValue!,\n                        dateSystem).ToString(\n                            "R",\n                            CultureInfo.InvariantCulture));\n                if (!isFormulaResult)\n                {\n                    cell.DataType = CellValues.Number;\n                }\n                return;''')

          # Formula bar is a single visual editing surface with hidden scrollbars.
          path = 'samples/NeraSpreadSheet.Avalonia.Sample/FullShellWindow.cs'
          replace(path,
              '''    private readonly TextBox _formula = new() { AcceptsReturn = true, MinHeight = 30, MaxHeight = 100 };''',
              '''    private readonly TextBox _formula = new()\n    {\n        AcceptsReturn = true,\n        MinHeight = 30,\n        MaxHeight = 100,\n        TextWrapping = global::Avalonia.Media.TextWrapping.NoWrap,\n        HorizontalScrollBarVisibility = global::Avalonia.Controls.Primitives.ScrollBarVisibility.Hidden,\n        VerticalScrollBarVisibility = global::Avalonia.Controls.Primitives.ScrollBarVisibility.Hidden,\n    };''')

          # The in-cell editor must never expose native scrollbars either.
          path = 'src/NeraSpreadSheet.Avalonia/NeraSpreadsheetControl.cs'
          replace(path,
              '''    private readonly TextBox _editor = new() { IsVisible = false, AcceptsReturn = true, BorderThickness = new Thickness(1), Padding = new Thickness(2, 0) };''',
              '''    private readonly TextBox _editor = new()\n    {\n        IsVisible = false,\n        AcceptsReturn = true,\n        BorderThickness = new Thickness(0),\n        Padding = new Thickness(0),\n        HorizontalScrollBarVisibility = global::Avalonia.Controls.Primitives.ScrollBarVisibility.Hidden,\n        VerticalScrollBarVisibility = global::Avalonia.Controls.Primitives.ScrollBarVisibility.Hidden,\n        IsInactiveSelectionHighlightEnabled = false,\n    };''')
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src samples
          git commit -m "fix(integration): Excel edit and date compatibility"
          git push origin HEAD:fix/excel-edit-date-integration-013
