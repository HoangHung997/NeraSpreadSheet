name: INTEGRATION-013-CODEMOD

on:
  push:
    branches: [fix/excel-edit-date-integration-013]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply source-aware compatibility patch
        run: python scripts/apply-integration-013.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src samples
          git commit -m "fix(integration): Excel edit and date compatibility"
          git push origin HEAD:fix/excel-edit-date-integration-013
