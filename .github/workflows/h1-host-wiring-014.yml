name: COMPAT-H1-014

on:
  push:
    branches: [compat/h1-host-wiring-014]

permissions:
  contents: read

jobs:
  windows-hosts:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore Windows solution
        run: dotnet restore NeraSpreadSheet.slnx
      - name: Build Windows hosts and analyzers
        run: dotnet build NeraSpreadSheet.slnx -c Release --no-restore
      - name: Run Windows rendering/native host regressions
        run: dotnet test tests/NeraSpreadSheet.Windows.Rendering.Tests/NeraSpreadSheet.Windows.Rendering.Tests.csproj -c Release --no-build
      - name: Run shared editing regressions
        run: dotnet test tests/NeraSpreadSheet.Editing.Tests/NeraSpreadSheet.Editing.Tests.csproj -c Release

  maui-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NeraMauiTargetFrameworks: net10.0-windows10.0.19041.0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Build MAUI Windows host
        run: dotnet build src/NeraSpreadSheet.Maui/NeraSpreadSheet.Maui.csproj -c Release -f net10.0-windows10.0.19041.0
