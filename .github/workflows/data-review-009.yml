name: DATA-REVIEW-009

on:
  push:
    branches: [fix/data-review-009]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore NeraSpreadSheet.Avalonia.slnx
      - name: Build Avalonia and analyzers
        run: dotnet build NeraSpreadSheet.Avalonia.slnx -c Release --no-restore
      - name: Editing Data Review regressions
        run: dotnet test tests/NeraSpreadSheet.Editing.Tests/NeraSpreadSheet.Editing.Tests.csproj -c Release
      - name: Avalonia Data Review regressions
        run: dotnet test tests/NeraSpreadSheet.Avalonia.Tests/NeraSpreadSheet.Avalonia.Tests.csproj -c Release --no-build
      - name: Core regressions
        run: dotnet test tests/NeraSpreadSheet.Core.Tests/NeraSpreadSheet.Core.Tests.csproj -c Release
      - name: OpenXML persistence and schema regressions
        run: dotnet test tests/NeraSpreadSheet.OpenXml.Tests/NeraSpreadSheet.OpenXml.Tests.csproj -c Release
