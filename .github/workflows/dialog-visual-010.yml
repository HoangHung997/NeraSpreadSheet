name: DIALOG-VISUAL-010

on:
  push:
    branches: [fix/dialog-visual-010]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      NERA_SOURCE_SHA: ${{ github.sha }}
      NERA_AVALONIA_ARTIFACTS: artifacts/avalonia
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore NeraSpreadSheet.Avalonia.slnx
      - name: Build and analyzers
        run: dotnet build NeraSpreadSheet.Avalonia.slnx -c Release --no-restore
      - name: Avalonia dialog visual regressions
        run: dotnet test tests/NeraSpreadSheet.Avalonia.Tests/NeraSpreadSheet.Avalonia.Tests.csproj -c Release --no-build --no-restore
      - name: Native dialogs smoke and image provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/avalonia -Force | Out-Null
          $app = 'samples/NeraSpreadSheet.Avalonia.Sample/bin/Release/net10.0/NeraSpreadSheet.Avalonia.Sample.dll'
          $lines = & dotnet $app --dialogs-smoke 2>&1
          $exit = $LASTEXITCODE
          $lines | Tee-Object artifacts/avalonia/dialogs-smoke.log
          if ($exit -ne 0) { throw "Native dialogs smoke exited $exit." }
          $prefix = 'NERA_AVALONIA_DIALOGS_SUCCESS '
          $records = @($lines | ForEach-Object { "$_" } | Where-Object { $_.StartsWith($prefix, [StringComparison]::Ordinal) })
          if ($records.Count -ne 1) { throw 'Expected exactly one dialogs success record.' }
          $result = $records[0].Substring($prefix.Length) | ConvertFrom-Json
          if ($result.sha -cne $env:NERA_SOURCE_SHA -or !$result.nativeWindow) { throw 'Dialog smoke exact-source/native-window postcondition failed.' }
          python scripts/verify-avalonia-dialogs.py artifacts/avalonia/dialogs $env:NERA_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Dialog image provenance failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dialog-visual-010-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
