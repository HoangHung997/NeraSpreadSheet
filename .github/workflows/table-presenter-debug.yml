name: table-presenter-debug

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  presenter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Editing presenter tests
        id: editing
        continue-on-error: true
        run: >-
          dotnet test tests/NeraSpreadSheet.Editing.Tests/NeraSpreadSheet.Editing.Tests.csproj
          -c Release
          --filter FullyQualifiedName~SpreadsheetTablePresenterTests
          --logger "console;verbosity=detailed"
      - name: Geometry tests
        id: geometry
        if: always()
        continue-on-error: true
        run: >-
          dotnet test tests/NeraSpreadSheet.Rendering.Spreadsheet.Tests/NeraSpreadSheet.Rendering.Spreadsheet.Tests.csproj
          -c Release
          --filter FullyQualifiedName~SpreadsheetTableFilterButtonGeometryTests
          --logger "console;verbosity=detailed"
      - name: Fail when a targeted suite failed
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.editing.outcome }}" != "success" || "${{ steps.geometry.outcome }}" != "success" ]]; then
            exit 1
          fi
