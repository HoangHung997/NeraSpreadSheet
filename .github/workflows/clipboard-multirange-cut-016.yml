name: CLIPBOARD-MULTIRANGE-CUT-016

on:
  push:
    branches: [compat/clipboard-multirange-cut-016]

permissions:
  contents: read

jobs:
  editing:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore NeraSpreadSheet.slnx
      - name: Build with analyzers
        run: dotnet build NeraSpreadSheet.slnx -c Release --no-restore
      - name: Editing regressions
        run: dotnet test tests/NeraSpreadSheet.Editing.Tests/NeraSpreadSheet.Editing.Tests.csproj -c Release --no-build
      - name: Commands regressions
        run: dotnet test tests/NeraSpreadSheet.Commands.Tests/NeraSpreadSheet.Commands.Tests.csproj -c Release --no-build
