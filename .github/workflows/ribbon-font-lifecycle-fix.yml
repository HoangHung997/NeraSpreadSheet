name: Apply Ribbon Font Lifecycle Fix

on:
  push:
    branches: [fix/ribbon-format-sync-011]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'refresh system fonts after native window opens') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ribbon-format-sync-011
      - name: Patch exact font lifecycle sites
        run: |
          python - <<'PY'
          from pathlib import Path

          ribbon = Path('samples/NeraSpreadSheet.Avalonia.Sample/FullShellWindow.Ribbon.cs')
          text = ribbon.read_text(encoding='utf-8')
          old = 'private static readonly Lazy<CommandItem[]> FontChoices = new(CreateSystemFontChoices);'
          new = 'private CommandItem[] _fontChoices = CreateSystemFontChoices();'
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace('FontChoices.Value', '_fontChoices')
          ribbon.write_text(text, encoding='utf-8')

          shell = Path('samples/NeraSpreadSheet.Avalonia.Sample/FullShellWindow.cs')
          text = shell.read_text(encoding='utf-8')
          needle = '        _ribbon = new NeraRibbonControl(_runtime);\n'
          insertion = needle + '        Opened += (_, _) => { _fontChoices = CreateSystemFontChoices(); _runtime.Refresh(); };\n'
          if insertion not in text:
              if needle not in text:
                  raise SystemExit('FullShellWindow ribbon construction site not found')
              text = text.replace(needle, insertion, 1)
          shell.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code && exit 0 || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add samples/NeraSpreadSheet.Avalonia.Sample/FullShellWindow.Ribbon.cs samples/NeraSpreadSheet.Avalonia.Sample/FullShellWindow.cs
          git commit -m "fix(ribbon): refresh system fonts after native window opens"
          git push origin HEAD:fix/ribbon-format-sync-011
