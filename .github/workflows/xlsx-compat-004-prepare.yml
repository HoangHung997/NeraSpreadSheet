name: Prepare XLSX compatibility 004 (temporary objects only)
on:
  push:
    branches: [feature/ribbon-dialogs-003]
    paths: ['eng/xlsx-compat-004/**', '.github/workflows/xlsx-compat-004-prepare.yml', 'src/NeraSpreadSheet.OpenXml/OpenXml*Compatibility*.cs', 'src/NeraSpreadSheet.OpenXml/OpenXml*FormattingGuard.cs', 'src/NeraSpreadSheet.OpenXml/OpenXmlImportDiagnostics.cs']
permissions:
  contents: write
concurrency:
  group: prepare-compat004
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Keep the adversarial fixture outside internal Core implementation types
        run: |
          python - <<'PY'
          from pathlib import Path
          core = Path('src/NeraSpreadSheet.Core/ConditionalFormatting.cs').read_text()
          if 'public const int MaxRulesPerWorksheet = 100_000;' not in core:
              raise ValueError('The rule limit changed; review the boundary fixture explicitly.')
          path = Path('eng/xlsx-compat-004/DxfCompatibilityTests.stage')
          text = path.read_text()
          old = 'WorksheetConditionalFormattingCollection.MaxRulesPerWorksheet + 1'
          if text.count(old) != 1:
              raise ValueError('Boundary fixture drift')
          path.write_text(text.replace(old, '100_001'), encoding='utf-8')
          PY
      - name: Apply reviewed guarded source edits and delivery wiring
        run: |
          python eng/xlsx-compat-004/prepare.py
          python eng/xlsx-compat-004/complete.py
          python eng/xlsx-compat-004/perf_delivery.py
      - name: Build and analyze prepared source
        run: |
          mkdir -p artifacts/compat004
          dotnet build NeraSpreadSheet.Avalonia.slnx -c Release 2>&1 | tee artifacts/compat004/build.log
          dotnet build NeraSpreadSheet.Core.slnx -c Release 2>&1 | tee artifacts/compat004/core-build.log
          dotnet build benchmarks/NeraSpreadSheet.CompatibilityProbe -c Release 2>&1 | tee artifacts/compat004/probe-build.log
      - name: Existing and compatibility regression tests
        run: |
          dotnet test tests/NeraSpreadSheet.OpenXml.Tests/NeraSpreadSheet.OpenXml.Tests.csproj -c Release --no-build --logger 'trx;LogFileName=openxml.trx' --results-directory artifacts/compat004 2>&1 | tee artifacts/compat004/openxml.log
          dotnet test tests/NeraSpreadSheet.Avalonia.Tests/NeraSpreadSheet.Avalonia.Tests.csproj -c Release --no-build --logger 'trx;LogFileName=avalonia.trx' --results-directory artifacts/compat004 2>&1 | tee artifacts/compat004/avalonia.log
          python -B -m unittest discover -s scripts/check-out -p 'test_*.py' -v
          python scripts/verify-architecture.py
      - name: Materialize code and workflow handoff without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python eng/xlsx-compat-004/prepare.py --materialize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat004-preparation-${{ github.sha }}
          path: artifacts/compat004
          if-no-files-found: warn
