name: Avalonia source evidence
on:
  push:
    branches: ['feature/avalonia-001-host']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive only tracked source at the exact commit
        run: |
          mkdir -p source-evidence
          git archive --format=zip --output=source-evidence/source.zip HEAD
          git rev-parse HEAD > source-evidence/source-sha.txt
          sha256sum source-evidence/source.zip > source-evidence/archive-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: avalonia-source-${{ github.sha }}
          path: source-evidence/
          retention-days: 3
          if-no-files-found: error
