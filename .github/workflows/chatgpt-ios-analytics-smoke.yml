name: ChatGPT iOS analytics accessibility smoke

on:
  push:
    branches:
      - 'ai/chatgpt/q003b-ios'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-analytics-smoke:
    name: Loaded MAUI iOS VoiceOver analytics smoke
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --skip-manifest-update

      - name: Build production MAUI iOS target
        run: dotnet build src/NeraSpreadSheet.Maui/NeraSpreadSheet.Maui.csproj -c Release -f net10.0-ios -p:NeraMauiTargetFrameworks=net10.0-ios

      - name: Build loaded iOS analytics accessibility smoke
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            RID="iossimulator-arm64"
          else
            RID="iossimulator-x64"
          fi
          echo "NERA_IOS_SMOKE_RID=$RID" >> "$GITHUB_ENV"
          echo "iOS simulator smoke RID: $RID"
          dotnet build tests/NeraSpreadSheet.Maui.iOS.AnalyticsSmoke/NeraSpreadSheet.Maui.iOS.AnalyticsSmoke.csproj \
            -c Release \
            -f net10.0-ios \
            -r "$RID" \
            -p:NeraMauiTargetFrameworks=net10.0-ios

      - name: Run loaded iOS analytics accessibility smoke
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID="com.neraspreadsheet.iosanalyticssmoke"
          ROOT="tests/NeraSpreadSheet.Maui.iOS.AnalyticsSmoke/bin/Release/net10.0-ios/$NERA_IOS_SMOKE_RID"
          LOG="$RUNNER_TEMP/nera-ios-analytics-smoke.log"

          APP="$(find "$ROOT" -type d -name 'NeraSpreadSheet.Maui.iOS.AnalyticsSmoke.app' | head -n 1 || true)"
          if [ -z "$APP" ]; then
            echo "iOS analytics smoke app bundle was not produced."
            find "$ROOT" -maxdepth 6 -print || true
            exit 1
          fi

          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime in sorted(data.get("devices", {}), reverse=True):
              if "SimRuntime.iOS-" not in runtime:
                  continue
              for device in data["devices"][runtime]:
                  if device.get("isAvailable", True) and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit(1)
          ')"
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator was found."
            xcrun simctl list devices available || true
            exit 1
          fi

          echo "Using iOS simulator: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          set +e
          python3 - "$UDID" "$BUNDLE_ID" "$LOG" <<'PY'
          import subprocess
          import sys

          udid, bundle_id, log_path = sys.argv[1:]
          command = ["xcrun", "simctl", "launch", "--console", udid, bundle_id]
          try:
              completed = subprocess.run(
                  command,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  timeout=90,
                  check=False,
              )
              output = completed.stdout or ""
              with open(log_path, "w", encoding="utf-8") as stream:
                  stream.write(output)
              print(output, end="")
              raise SystemExit(completed.returncode)
          except subprocess.TimeoutExpired as exception:
              output = exception.stdout or ""
              if isinstance(output, bytes):
                  output = output.decode("utf-8", errors="replace")
              with open(log_path, "w", encoding="utf-8") as stream:
                  stream.write(output)
              print(output, end="")
              print("iOS analytics accessibility smoke timed out while attached to simulator console.")
              raise SystemExit(124)
          PY
          LAUNCH_STATUS=$?
          set -e

          if grep -Fq 'NERA_IOS_ANALYTICS_SMOKE:{"status":"success"' "$LOG"; then
            echo "Loaded iOS VoiceOver analytics accessibility smoke passed."
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
            exit 0
          fi

          if grep -Fq 'NERA_IOS_ANALYTICS_SMOKE:{"status":"failure"' "$LOG"; then
            echo "Loaded iOS VoiceOver analytics accessibility smoke reported failure."
          else
            echo "Loaded iOS VoiceOver analytics accessibility smoke produced no result marker. launch status=$LAUNCH_STATUS"
          fi

          echo "--- iOS smoke console ---"
          cat "$LOG" || true
          echo "--- recent simulator diagnostics ---"
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process CONTAINS "NeraSpreadSheet" OR eventMessage CONTAINS "NeraSpreadSheet"' \
            | tail -n 400 || true
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/nera-ios-analytics-smoke.png" || true
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          exit 1
