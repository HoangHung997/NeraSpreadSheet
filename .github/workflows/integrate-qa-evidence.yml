name: INTEGRATE-QA-EVIDENCE

on:
  push:
    branches: [fix/excel-edit-date-integration-013]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bring September 11 QA reports and binary evidence into the validated integration line
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          qa = 'd2a704ad976fc09853f5db679698816cc82f4a92'
          subprocess.run(['git', 'fetch', 'origin', qa], check=True)
          names = subprocess.check_output(
              ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', qa],
              text=True).splitlines()
          copied = []
          for path in names:
              if not path or path == 'docs/worklog/CURRENT.md':
                  continue
              subprocess.run(['git', 'checkout', qa, '--', path], check=True)
              copied.append(path)
          if not copied:
              raise SystemExit('No QA evidence paths were copied')
          Path('.github/workflows/integrate-qa-evidence.yml').unlink()
          print('QA_EVIDENCE_PATHS', len(copied))
      - name: Commit evidence and remove temporary workflow
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(qa): preserve September Excel comparison evidence"
          git push origin HEAD:fix/excel-edit-date-integration-013
