name: TABLE007 native diagnostics

on:
  push:
    branches: ['feature/table-007-editor-corpus']
  workflow_dispatch:

permissions:
  contents: read

# Diagnostic iteration only. Final acceptance also requires all existing gates.
# Existing runners retain their runtime timeout, attempts, assertions and failure logs.
jobs:
  windows:
    name: TABLE007 loaded Windows editor and GPU stress
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Publish loaded MAUI Windows runtime smoke
        run: dotnet publish tests/NeraSpreadSheet.Maui.Windows.Smoke/NeraSpreadSheet.Maui.Windows.Smoke.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained false -p:NeraMauiTargetFrameworks=net10.0-windows10.0.19041.0 -o artifacts/maui-windows-smoke
      - name: Run loaded MAUI Windows runtime smoke
        shell: pwsh
        run: ./scripts/run-maui-windows-smoke.ps1 -ExecutablePath "artifacts/maui-windows-smoke/NeraSpreadSheet.Maui.Windows.Smoke.exe"

  maccatalyst:
    name: TABLE007 loaded Mac editor and analytics
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install MAUI Apple workloads
        run: dotnet workload install maui-ios maui-maccatalyst --skip-manifest-update
      - name: Build loaded MAUI Mac Catalyst analytics accessibility smoke
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            RID="maccatalyst-arm64"
          else
            RID="maccatalyst-x64"
          fi
          echo "NERA_MACCATALYST_SMOKE_RID=$RID" >> "$GITHUB_ENV"
          echo "Mac Catalyst smoke RID: $RID"
          dotnet build tests/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke.csproj -c Release -f net10.0-maccatalyst -r "$RID" -p:NeraMauiTargetFrameworks=net10.0-maccatalyst
      - name: Run loaded MAUI Mac Catalyst analytics accessibility smoke
        shell: bash
        run: |
          set -euo pipefail
          ROOT="tests/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke/bin/Release/net10.0-maccatalyst/$NERA_MACCATALYST_SMOKE_RID"
          RESULT="$RUNNER_TEMP/nera-maccatalyst-analytics-smoke.json"
          APP="$(find "$ROOT" -type d -name 'NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke.app' | head -n 1 || true)"
          if [ -z "$APP" ]; then
            echo "Mac Catalyst analytics smoke app bundle was not produced."
            find "$ROOT" -maxdepth 6 -print || true
            exit 1
          fi
          bash ./scripts/run-maui-maccatalyst-smoke.sh "$APP" "$RESULT"
