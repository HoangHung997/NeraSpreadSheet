name: TABLE007 native diagnostics

on:
  push:
    branches: ['feature/table-007-editor-corpus']
  workflow_dispatch:

permissions:
  contents: read

# Diagnostic iteration only. Final acceptance also requires all existing gates.
# Existing runners retain their runtime timeout, attempts, assertions and failure logs.
jobs:
  windows:
    name: TABLE007 loaded Windows editor and GPU stress
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Checkout pinned baseline
        uses: actions/checkout@v6
        with:
          ref: 2e8482c25a44797a479b276ae26f472811a0a81e
          path: baseline
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install MAUI Windows workload
        id: workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Publish baseline Windows runtime smoke
        id: baseline_build
        working-directory: baseline
        run: dotnet publish tests/NeraSpreadSheet.Maui.Windows.Smoke/NeraSpreadSheet.Maui.Windows.Smoke.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained false -p:NeraMauiTargetFrameworks=net10.0-windows10.0.19041.0 -o artifacts/maui-windows-smoke
      - name: Run baseline Windows runtime smoke with current runner
        id: baseline_run
        shell: pwsh
        run: ./scripts/run-maui-windows-smoke.ps1 -ExecutablePath "baseline/artifacts/maui-windows-smoke/NeraSpreadSheet.Maui.Windows.Smoke.exe"
      - name: Publish candidate Windows runtime smoke
        id: candidate_build
        if: ${{ !cancelled() && steps.workload.outcome == 'success' }}
        run: dotnet publish tests/NeraSpreadSheet.Maui.Windows.Smoke/NeraSpreadSheet.Maui.Windows.Smoke.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained false -p:NeraMauiTargetFrameworks=net10.0-windows10.0.19041.0 -o artifacts/maui-windows-smoke
      - name: Run candidate Windows runtime smoke
        id: candidate_run
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/run-maui-windows-smoke.ps1 -ExecutablePath "artifacts/maui-windows-smoke/NeraSpreadSheet.Maui.Windows.Smoke.exe"
      - name: Record paired Windows outcomes
        if: always()
        shell: pwsh
        run: |
          @'
          Baseline: 2e8482c25a44797a479b276ae26f472811a0a81e
          Candidate: ${{ github.sha }}
          Baseline build/run: ${{ steps.baseline_build.outcome }} / ${{ steps.baseline_run.outcome }}
          Candidate build/run: ${{ steps.candidate_build.outcome }} / ${{ steps.candidate_run.outcome }}
          Baseline comparison does not replace candidate acceptance. Every failed step retains job failure.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  maccatalyst:
    name: TABLE007 loaded Mac editor and analytics
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Checkout pinned baseline
        uses: actions/checkout@v6
        with:
          ref: 2e8482c25a44797a479b276ae26f472811a0a81e
          path: baseline
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install MAUI Apple workloads
        id: workload
        run: dotnet workload install maui-ios maui-maccatalyst --skip-manifest-update
      - name: Select shared Mac Catalyst runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            RID="maccatalyst-arm64"
          else
            RID="maccatalyst-x64"
          fi
          echo "NERA_MACCATALYST_SMOKE_RID=$RID" >> "$GITHUB_ENV"
          echo "Mac Catalyst smoke RID: $RID"
      - name: Build baseline Mac Catalyst analytics smoke
        id: baseline_build
        working-directory: baseline
        run: dotnet build tests/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke.csproj -c Release -f net10.0-maccatalyst -r "$NERA_MACCATALYST_SMOKE_RID" -p:NeraMauiTargetFrameworks=net10.0-maccatalyst
      - name: Run baseline Mac Catalyst analytics smoke with current runner
        id: baseline_run
        shell: bash
        run: |
          set -euo pipefail
          ROOT="baseline/tests/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke/bin/Release/net10.0-maccatalyst/$NERA_MACCATALYST_SMOKE_RID"
          RESULT="$RUNNER_TEMP/nera-maccatalyst-baseline-smoke.json"
          APP="$(find "$ROOT" -type d -name 'NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke.app' | head -n 1 || true)"
          if [ -z "$APP" ]; then
            echo "Baseline Mac Catalyst analytics smoke app bundle was not produced."
            exit 1
          fi
          bash ./scripts/run-maui-maccatalyst-smoke.sh "$APP" "$RESULT"
      - name: Build candidate Mac Catalyst analytics smoke
        id: candidate_build
        if: ${{ !cancelled() && steps.workload.outcome == 'success' && steps.runtime.outcome == 'success' }}
        run: dotnet build tests/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke.csproj -c Release -f net10.0-maccatalyst -r "$NERA_MACCATALYST_SMOKE_RID" -p:NeraMauiTargetFrameworks=net10.0-maccatalyst
      - name: Run candidate Mac Catalyst analytics smoke
        id: candidate_run
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="tests/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke/bin/Release/net10.0-maccatalyst/$NERA_MACCATALYST_SMOKE_RID"
          RESULT="$RUNNER_TEMP/nera-maccatalyst-candidate-smoke.json"
          APP="$(find "$ROOT" -type d -name 'NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke.app' | head -n 1 || true)"
          if [ -z "$APP" ]; then
            echo "Mac Catalyst analytics smoke app bundle was not produced."
            find "$ROOT" -maxdepth 6 -print || true
            exit 1
          fi
          bash ./scripts/run-maui-maccatalyst-smoke.sh "$APP" "$RESULT"
      - name: Inspect generated Apple registrar metadata without rebuilding
        if: ${{ !cancelled() && steps.baseline_build.outcome == 'success' && steps.candidate_build.outcome == 'success' }}
        shell: bash
        run: python3 ./scripts/inspect-table007-apple-registrar.py
      - name: Checkout same-source native subclass exclusion variant
        id: variant_checkout
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: class-exclusion-variant
      - name: Apply only the approved native subclass exclusion patch
        id: variant_prepare
        if: ${{ !cancelled() && steps.variant_checkout.outcome == 'success' }}
        working-directory: class-exclusion-variant
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('../scripts/table007-exclude-apple-subclass.patch')
          expected = 'cfc3b7cec04b46b822dd9eb6398b3b43d13bf4fe97ce9047049699e2f08e8fcf'
          if hashlib.sha256(path.read_bytes()).hexdigest() != expected:
              raise SystemExit('The approved class exclusion patch hash differs.')
          print('Approved variant patch SHA256: ' + expected)
          PY
          git apply --check ../scripts/table007-exclude-apple-subclass.patch
          git apply ../scripts/table007-exclude-apple-subclass.patch
          python3 - <<'PY'
          import subprocess
          expected = ['src/NeraSpreadSheet.Maui/NeraCellEditorHandler.Apple.cs',
                      'src/NeraSpreadSheet.Maui/NeraSpreadSheetMauiAppBuilderExtensions.cs']
          if subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines() != expected:
              raise SystemExit('The class exclusion variant modified unexpected paths.')
          PY
          git diff --check
          git diff -- src/NeraSpreadSheet.Maui/NeraCellEditorHandler.Apple.cs src/NeraSpreadSheet.Maui/NeraSpreadSheetMauiAppBuilderExtensions.cs
          git -C .. diff --exit-code
      - name: Build native subclass exclusion variant with original assertions
        id: variant_build
        if: ${{ !cancelled() && steps.variant_prepare.outcome == 'success' }}
        working-directory: class-exclusion-variant
        run: dotnet build tests/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke.csproj -c Release -f net10.0-maccatalyst -r "$NERA_MACCATALYST_SMOKE_RID" -p:NeraMauiTargetFrameworks=net10.0-maccatalyst
      - name: Verify generated native subclass absence before launch
        id: variant_verify
        if: ${{ !cancelled() && steps.variant_build.outcome == 'success' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import runpy
          module = runpy.run_path('scripts/inspect-table007-apple-registrar.py')
          checkout = Path('class-exclusion-variant').resolve()
          report = module['cohort_report'](checkout, os.environ['NERA_MACCATALYST_SMOKE_RID'])
          generated = [item for item in report['generatedFiles'] if 'registrar' in Path(item['file']).name]
          if report['sourceSha'] != '${{ github.sha }}' or report['registrarMetadata'] != 'available' or not generated:
              raise SystemExit('Generated class metadata is unavailable for the expected variant source.')
          root = checkout / 'tests/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke/obj'
          for item in generated:
              if 'sha256' not in item:
                  raise SystemExit('Generated registrar exceeded its read budget.')
              with (root / item['file']).open('rb') as stream:
                  raw = stream.read(module['MAX_FILE_BYTES'] + 1)
              if len(raw) > module['MAX_FILE_BYTES'] or hashlib.sha256(raw).hexdigest() != item['sha256']:
                  raise SystemExit('Generated registrar changed after the bounded audit.')
              if b'CellTextView' in raw:
                  raise SystemExit('The excluded native subclass still exists in generated registrar output.')
          print(json.dumps({'variantSource': report['sourceSha'], 'generatedCellTextViewAbsent': True,
                            'registrarHashes': {item['file']: item['sha256'] for item in generated}}))
          PY
      - name: Run native subclass exclusion variant with current runner
        id: variant_run
        if: ${{ !cancelled() && steps.variant_verify.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="class-exclusion-variant/tests/NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke/bin/Release/net10.0-maccatalyst/$NERA_MACCATALYST_SMOKE_RID"
          RESULT="$RUNNER_TEMP/nera-maccatalyst-class-exclusion-variant-smoke.json"
          APP="$(find "$ROOT" -type d -name 'NeraSpreadSheet.Maui.MacCatalyst.AnalyticsSmoke.app' | head -n 1 || true)"
          if [ -z "$APP" ]; then
            echo "Mac native subclass exclusion variant app bundle was not produced."
            exit 1
          fi
          git diff --exit-code
          bash ./scripts/run-maui-maccatalyst-smoke.sh "$APP" "$RESULT"
      - name: Record paired Mac Catalyst outcomes
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Baseline: 2e8482c25a44797a479b276ae26f472811a0a81e
          Candidate: ${{ github.sha }}
          Baseline build/run: ${{ steps.baseline_build.outcome }} / ${{ steps.baseline_run.outcome }}
          Candidate build/run: ${{ steps.candidate_build.outcome }} / ${{ steps.candidate_run.outcome }}
          Baseline comparison does not replace candidate acceptance. Every failed step retains job failure.
          Native subclass exclusion variant source: ${{ github.sha }}; patch cfc3b7cec04b46b822dd9eb6398b3b43d13bf4fe97ce9047049699e2f08e8fcf.
          Variant build/absence-check/run: ${{ steps.variant_build.outcome }} / ${{ steps.variant_verify.outcome }} / ${{ steps.variant_run.outcome }}
          Variant is diagnostic only and never replaces candidate acceptance or native editor assertions.
          SUMMARY
