name: apply-rich-autofilter-batch

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/bootstrap-architecture-v0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/bootstrap-architecture-v0.1
          fetch-depth: 0

      - name: Decode patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .automation/rich-autofilter.patch.gz.b64 | gzip --decompress > /tmp/rich-autofilter.patch

      - name: Apply batch with three-way merge and remove automation inputs
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way --whitespace=error-all /tmp/rich-autofilter.patch
          if git ls-files --unmerged | grep -q .; then
            echo "Patch produced merge conflicts:" >&2
            git status --short >&2
            exit 1
          fi
          rm -f .automation/rich-autofilter.patch.gz.b64
          rmdir .automation 2>/dev/null || true
          rm -f .github/workflows/apply-rich-autofilter-batch.yml
          git diff --check

      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add rich and worksheet AutoFilter foundations"
          git push origin HEAD:feature/bootstrap-architecture-v0.1
