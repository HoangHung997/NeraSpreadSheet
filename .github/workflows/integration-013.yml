name: INTEGRATION-013

on:
  push:
    branches: [fix/excel-edit-date-integration-013]

permissions:
  contents: read

env:
  NERA_SOURCE_SHA: ${{ github.sha }}
  NERA_AVALONIA_ARTIFACTS: artifacts/avalonia

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore Avalonia
        run: dotnet restore NeraSpreadSheet.Avalonia.slnx
      - name: Build Avalonia + analyzers
        run: dotnet build NeraSpreadSheet.Avalonia.slnx -c Release --no-restore
      - name: Core regressions
        run: dotnet test tests/NeraSpreadSheet.Core.Tests/NeraSpreadSheet.Core.Tests.csproj -c Release
      - name: Formula regressions
        run: dotnet test tests/NeraSpreadSheet.Formulas.Tests/NeraSpreadSheet.Formulas.Tests.csproj -c Release
      - name: OpenXML regressions
        run: dotnet test tests/NeraSpreadSheet.OpenXml.Tests/NeraSpreadSheet.OpenXml.Tests.csproj -c Release
      - name: Avalonia regressions
        run: dotnet test tests/NeraSpreadSheet.Avalonia.Tests/NeraSpreadSheet.Avalonia.Tests.csproj -c Release --no-build
      - name: Native executable regressions
        shell: pwsh
        run: |
          dotnet publish samples/NeraSpreadSheet.Avalonia.Sample/NeraSpreadSheet.Avalonia.Sample.csproj -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -p:PublishSingleFile=false -o artifacts/app
          $app = Join-Path $pwd 'artifacts/app/NeraSpreadSheet.Avalonia.Sample.exe'
          & $app --qa-gaps-smoke
          if ($LASTEXITCODE -ne 0) { throw "QA gaps smoke failed: $LASTEXITCODE" }
          & $app --dialogs-smoke
          if ($LASTEXITCODE -ne 0) { throw "Dialog smoke failed: $LASTEXITCODE" }
          & $app --format-sync-smoke
          if ($LASTEXITCODE -ne 0) { throw "Format sync smoke failed: $LASTEXITCODE" }
