name: Prepare Ribbon dialogs 003 source (temporary)
on:
  push:
    branches: [feature/ribbon-dialogs-003]
permissions:
  contents: write
concurrency:
  group: ribbon-dialogs-003-prepare
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Repair the two verified stale workflow anchors in the temporary preparer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('eng/ribbon-dialogs-003/prepare.py')
          text = p.read_text(encoding='utf-8')
          fixes = {
              "@('smoke', 'full-ui-smoke', 'formula-ux-smoke', 'ribbon-visual-smoke')": "@('smoke','full-ui-smoke','formula-ux-smoke','ribbon-visual-smoke')",
              'Published Ribbon evidence validation failed.': 'Published image provenance failed.',
          }
          for old, new in fixes.items():
              expected = 1 if old.startswith('@(') else 2
              if text.count(old) != expected:
                  raise ValueError(f'Preparation repair drift: expected {expected} occurrences of {old!r}')
              text = text.replace(old, new)
          compile(text, str(p), 'exec')
          p.write_text(text, encoding='utf-8', newline='\n')
          print('Verified preparer repairs; all source replacement-count guards remain active.')
          PY
      - name: Apply exact guarded source edits
        run: python eng/ribbon-dialogs-003/prepare.py
      - name: Fix verified API and ownership build errors without suppressing analyzers
        run: |
          python - <<'PY'
          from pathlib import Path
          def change(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise ValueError(f'API/lifetime source drift in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          change('src/NeraSpreadSheet.Avalonia/NeraSettingsDialog.cs', 'Watermark = L(', 'PlaceholderText = L(')
          for name in ('NeraFormatCellsDialog', 'NeraPageSetupDialog'):
              path = 'src/NeraSpreadSheet.Avalonia/' + name + '.cs'
              change(path, f'public sealed class {name} : NeraSettingsDialog',
                  f'public sealed class {name} : NeraSettingsDialog, IDisposable')
              change(path, '    protected override bool TryApply()', '''    /// <summary>Releases target subscriptions even when this dialog has never been shown.
              /// Call on the UI thread. Closing a shown dialog also releases its draft.</summary>
              public void Dispose()
              {
                  global::Avalonia.Threading.Dispatcher.UIThread.VerifyAccess();
                  _draft.Dispose();
                  if (IsVisible) Close(false);
                  GC.SuppressFinalize(this);
              }

              protected override bool TryApply()''')
          change('samples/NeraSpreadSheet.Avalonia.Sample/FullShellWindow.DialogSmoke.cs',
              'using System.Text.Json;\n', 'using System.Text.Json;\nusing global::Avalonia;\n')
          path = 'tests/NeraSpreadSheet.Avalonia.Tests/SettingsDialogTests.cs'
          change(path, 'public sealed class SettingsDialogTests\n{',
              'public sealed class SettingsDialogTests\n{\n    private static readonly bool[] CancelModes = [false, true];')
          change(path, 'foreach (var escape in new[] { false, true })', 'foreach (var escape in CancelModes)')
          PY
      - name: Build and analyze the prepared source
        run: |
          mkdir -p artifacts/preparation
          dotnet build NeraSpreadSheet.Avalonia.slnx -c Release 2>&1 | tee artifacts/preparation/build.log
      - name: Test shared formatting and native control contracts
        run: |
          dotnet test tests/NeraSpreadSheet.Editing.Tests/NeraSpreadSheet.Editing.Tests.csproj -c Release --logger 'trx;LogFileName=editing.trx' --results-directory artifacts/preparation 2>&1 | tee artifacts/preparation/editing.log
          dotnet test tests/NeraSpreadSheet.Avalonia.Tests/NeraSpreadSheet.Avalonia.Tests.csproj -c Release --no-build --logger 'trx;LogFileName=avalonia.trx' --results-directory artifacts/preparation 2>&1 | tee artifacts/preparation/avalonia.log
          python -B -m unittest discover -s scripts/check-out -p 'test_*.py' -v
      - name: Create reviewed commit object only; connector must advance the temporary ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: python eng/ribbon-dialogs-003/prepare.py --materialize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ribbon-dialogs-prepared-${{ github.sha }}
          path: artifacts/preparation
          if-no-files-found: warn
